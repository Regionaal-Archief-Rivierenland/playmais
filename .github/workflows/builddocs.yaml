name: docs
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  docs:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: |
          uv run --with pdoc python -m pdoc \
            -d google \
            --favicon /playmais/icon.png \
            --logo /playmais/logo.png \
            --logo-link https://github.com/Regionaal-Archief-Rivierenland/playmais \
            -o docs playmais
      - run: cp assets/*.png docs/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
